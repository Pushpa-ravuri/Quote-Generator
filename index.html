<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Quote Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>3D Quote Generator</h2>

<div class="card" id="quoteCard">
    <div class="card-inner">
        <div class="card-front">
            <p id="quote">Click the button to generate a quote</p>
            <h4 id="author"></h4>
        </div>
    </div>
</div>

<button id="btn">New Quote</button>

</div>

<script src="script.js"></script>
</body>
</html>
